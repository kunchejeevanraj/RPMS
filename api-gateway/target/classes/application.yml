spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: property-service
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/v1/properties/**
        - id: booking-service
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/api/v1/bookings/**
        - id: payment-service
          uri: lhttp://127.0.0.1:8084
          predicates:
            - Path=/api/v1/payments/**
        - id: notification-service
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/api/v1/notifications/**
  application:
    name: API-GATEWAY
server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/